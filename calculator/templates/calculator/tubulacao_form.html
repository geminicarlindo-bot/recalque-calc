{% extends "calculator/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<h2>{% if object %}Editar Tubulação{% else %}Adicionar Nova Tubulação{% endif %}</h2>
<hr>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success mt-3">Salvar</button>
    <a href="{% url 'tubulacao_list' %}" class="btn btn-secondary mt-3">Cancelar</a>
</form>
{% endblock %}
