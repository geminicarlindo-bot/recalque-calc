{% extends "calculator/base.html" %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Catálogo de Materiais</h2>
    <a href="{% url 'material_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Adicionar Novo Material
    </a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Rugosidade (mm)</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for material in materiais %}
                <tr>
                    <td>{{ material.nome }}</td>
                    <td>{{ material.rugosidade_mm }}</td>
                    <td>
                        <a href="{% url 'material_update' material.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <a href="{% url 'material_delete' material.pk %}" class="btn btn-sm btn-outline-danger">Deletar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">Nenhum material cadastrado.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
