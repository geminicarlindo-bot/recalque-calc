{% extends "calculator/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Catálogo de Peças e Acessórios</h2>
    <a href="{% url 'peca_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Adicionar Nova Peça
    </a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for peca in pecas %}
                <tr>
                    <td>{{ peca.nome }}</td>
                    <td>{{ peca.descricao|default:"-" }}</td>
                    <td>
                        <a href="{% url 'peca_update' peca.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <a href="{% url 'peca_delete' peca.pk %}" class="btn btn-sm btn-outline-danger">Deletar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">Nenhuma peça cadastrada.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
