{% extends "calculator/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Meu Catálogo de Bombas</h2>
    <a href="{% url 'bomba_create' %}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Adicionar Nova Bomba
    </a>
</div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr><th>Fabricante</th><th>Modelo</th><th>Ações</th></tr>
            </thead>
            <tbody>
                {% for bomba in bombas %}
                <tr>
                    <td>{{ bomba.fabricante }}</td>
                    <td>{{ bomba.modelo }}</td>
                    <td>
                        <a href="{% url 'bomba_update' bomba.pk %}" class="btn btn-sm btn-primary">
                            <i class="bi bi-pencil-fill"></i> Editar / Ver Curva
                        </a>
                        <a href="{% url 'bomba_delete' bomba.pk %}" class="btn btn-sm btn-outline-danger">Deletar</a>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center">Nenhuma bomba cadastrada.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
