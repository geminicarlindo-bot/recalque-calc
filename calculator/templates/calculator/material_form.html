{% extends "calculator/base.html" %}
{% load crispy_forms_tags %} {% block content %}
<h2>{% if object %}Editar Material{% else %}Adicionar Novo Material{% endif %}</h2>
<hr>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }} <button type="submit" class="btn btn-success mt-3">Salvar</button>
    <a href="{% url 'material_list' %}" class="btn btn-secondary mt-3">Cancelar</a>
</form>
{% endblock %}
